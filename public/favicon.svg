<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1508"/>
      <stop offset="100%" stop-color="#080502"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7e098"/>
      <stop offset="35%" stop-color="#d4a82a"/>
      <stop offset="70%" stop-color="#a07820"/>
      <stop offset="100%" stop-color="#d4a82a"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f7e098"/>
      <stop offset="50%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#6e4e0e"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7e098"/>
      <stop offset="50%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#f7e098"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="31" fill="url(#bgGrad)"/>
  <!-- Gold outer ring -->
  <circle cx="32" cy="32" r="30.5" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Spray mist particles (larger, top-right) -->
  <g filter="url(#glow)" opacity="0.9">
    <circle cx="46" cy="10" r="1.6" fill="#f7e098" opacity="0.9"/>
    <circle cx="50" cy="9"  r="1.2" fill="#f7e098" opacity="0.75"/>
    <circle cx="53" cy="11" r="0.9" fill="#f7e098" opacity="0.6"/>
    <circle cx="48" cy="13" r="1.0" fill="#f7e098" opacity="0.6"/>
    <circle cx="51" cy="14" r="0.7" fill="#f7e098" opacity="0.5"/>
    <circle cx="54" cy="13" r="0.6" fill="#f7e098" opacity="0.4"/>
    <circle cx="49" cy="7"  r="0.8" fill="#f7e098" opacity="0.5"/>
    <circle cx="52" cy="7"  r="0.5" fill="#f7e098" opacity="0.4"/>
    <circle cx="55" cy="9"  r="0.5" fill="#f7e098" opacity="0.35"/>
  </g>

  <!-- Bottle nozzle head -->
  <rect x="24" y="9" width="12" height="4" rx="1.5" fill="url(#goldGrad)"/>
  <!-- Nozzle tip (spray outlet) -->
  <rect x="28" y="6" width="6" height="4" rx="1" fill="url(#shimmer)"/>
  <!-- Tiny nozzle hole -->
  <circle cx="34" cy="8" r="1" fill="#1a1000"/>

  <!-- Bottle neck -->
  <rect x="26" y="13" width="10" height="7" rx="2" fill="url(#goldGrad)"/>
  <!-- Neck highlight -->
  <rect x="27" y="14" width="3" height="5" rx="1" fill="#f7e098" opacity="0.3"/>

  <!-- Bottle shoulder (trapezoid) -->
  <path d="M20 22 Q19 20 26 20 L36 20 Q43 20 44 22 L44 26 Q38 24 32 24 Q26 24 20 26Z"
        fill="url(#goldGrad)"/>

  <!-- Main bottle body -->
  <path d="M20 26 Q18 32 19 40 Q20 48 32 51 Q44 48 45 40 Q46 32 44 26 Q38 24 32 24 Q26 24 20 26Z"
        fill="url(#goldGrad)"/>

  <!-- Body highlight (left sheen) -->
  <path d="M22 28 Q21 34 22 41 Q23 46 27 48 Q24 43 24 37 Q23 30 25 26 Q23 26.5 22 28Z"
        fill="#f7e098" opacity="0.3"/>

  <!-- Body shadow (right) -->
  <path d="M42 28 Q44 34 43 41 Q42 46 38 48 Q40 43 40 37 Q41 30 39 26 Q41 26.5 42 28Z"
        fill="#5a3c08" opacity="0.45"/>

  <!-- Decorative leaf/floral on body -->
  <path d="M32 30 Q37 33 36 40 Q33 43 29 40 Q28 33 32 30Z"
        fill="#f7e098" opacity="0.2"/>
  <path d="M32 30 Q35 33 34 38 Q32 40 30 38 Q29 33 32 30Z"
        fill="#f7e098" opacity="0.15"/>

  <!-- Bottom label area (subtle) -->
  <path d="M23 44 Q32 47 41 44 Q40 50 32 51 Q24 50 23 44Z"
        fill="#a07820" opacity="0.4"/>

  <!-- Bottom highlight arc -->
  <path d="M26 54 Q32 57 38 54"
        fill="none" stroke="#c9a227" stroke-width="0.8" stroke-opacity="0.5" stroke-linecap="round"/>
</svg>
